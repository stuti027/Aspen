<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aspen Time Simulation Test</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">
    <h1>Aspen Time-Travel Clock Test</h1>
    <p>Current Rendered Time:</p>
    <div id="clock" style="font-size: 24px; font-weight: bold; color: blue;">Loading...</div>

    <script>
        function updateClock() {
            // This calls our intercepted Date object!
            const now = new Date();
            document.getElementById('clock').innerText = now.toUTCString();
        }

        // Update every second
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
