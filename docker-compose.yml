services:
  db:
    image: postgres:16
    container_name: aspen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aspen
      POSTGRES_USER: aspen_user
      POSTGRES_PASSWORD: aspen_password
    ports:
      - "5432:5432"
    volumes:
      - aspen_postgres_data:/var/lib/postgresql/data

volumes:
  aspen_postgres_data: